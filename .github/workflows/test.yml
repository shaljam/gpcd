name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.19', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/gpcd
      - name: Verify installable module
        shell: bash
        run: |
          if grep -Eq '^[[:space:]]*(replace|exclude)([[:space:]]|$)' go.mod; then
            echo "Versioned go install must not require replacements or exclusions"
            exit 1
          fi
          go install ./cmd/gpcd